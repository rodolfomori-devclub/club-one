# LiteLLM proxy — ClubHub (prod). Modelos ATUAIS dos providers; chaves vêm do env
# (setadas no serviço do Railway). master_key = LITELLM_MASTER_KEY.
model_list:
  # ── OpenAI (GPT-5.x — os 4.x/o1 foram aposentados) ──
  - model_name: gpt-5.6-terra
    litellm_params: { model: openai/gpt-5.6-terra, api_key: os.environ/OPENAI_API_KEY }
  - model_name: gpt-5.6-luna
    litellm_params: { model: openai/gpt-5.6-luna, api_key: os.environ/OPENAI_API_KEY }
  - model_name: gpt-5.4-mini
    litellm_params: { model: openai/gpt-5.4-mini, api_key: os.environ/OPENAI_API_KEY }

  # ── Anthropic (Claude 4.x / 5) ──
  - model_name: claude-opus-4-8
    litellm_params: { model: anthropic/claude-opus-4-8, api_key: os.environ/ANTHROPIC_API_KEY }
  - model_name: claude-sonnet-5
    litellm_params: { model: anthropic/claude-sonnet-5, api_key: os.environ/ANTHROPIC_API_KEY }
  - model_name: claude-haiku-4-5
    litellm_params: { model: anthropic/claude-haiku-4-5, api_key: os.environ/ANTHROPIC_API_KEY }

  # ── Google Gemini ──
  - model_name: gemini-2.5-pro
    litellm_params: { model: gemini/gemini-2.5-pro, api_key: os.environ/GEMINI_API_KEY }
  - model_name: gemini-2.5-flash
    litellm_params: { model: gemini/gemini-2.5-flash, api_key: os.environ/GEMINI_API_KEY }

  # ── DeepSeek ──
  - model_name: deepseek-chat
    litellm_params: { model: deepseek/deepseek-chat, api_key: os.environ/DEEPSEEK_API_KEY }
  - model_name: deepseek-reasoner
    litellm_params: { model: deepseek/deepseek-reasoner, api_key: os.environ/DEEPSEEK_API_KEY }

  # ── Perplexity (busca web) ──
  - model_name: sonar-pro
    litellm_params: { model: perplexity/sonar-pro, api_key: os.environ/PERPLEXITY_API_KEY }

  # ── xAI (Grok) ──
  - model_name: grok-4-latest
    litellm_params: { model: xai/grok-4-latest, api_key: os.environ/XAI_API_KEY }

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
