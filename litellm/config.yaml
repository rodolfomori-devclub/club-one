# LiteLLM proxy — ClubHub (prod). Modelos ATUAIS dos providers; chaves vêm do env
# (setadas no serviço do Railway). master_key = LITELLM_MASTER_KEY.
model_list:
  # ── OpenAI ── (curadoria por custo: nanos/minis + Luna como topo do grupo.
  # additional_drop_params reasoning_effort: a OpenAI rejeita tools +
  # reasoning_effort juntos no /chat/completions dos 5.x; descartando o param,
  # o modelo usa o esforço default e ferramentas sempre funcionam.)
  - model_name: gpt-5-nano
    litellm_params:
      model: openai/gpt-5-nano
      api_key: os.environ/OPENAI_API_KEY
      additional_drop_params: ["reasoning_effort"]
  - model_name: gpt-5.4-nano
    litellm_params:
      model: openai/gpt-5.4-nano
      api_key: os.environ/OPENAI_API_KEY
      additional_drop_params: ["reasoning_effort"]
  - model_name: gpt-5-mini
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY
      additional_drop_params: ["reasoning_effort"]
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      additional_drop_params: ["reasoning_effort"]
  - model_name: gpt-4.1-mini
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: os.environ/OPENAI_API_KEY
      additional_drop_params: ["reasoning_effort"]
  - model_name: gpt-5.6-luna
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: os.environ/OPENAI_API_KEY
      additional_drop_params: ["reasoning_effort"]

  # ── Anthropic ── (só os 2 de melhor custo: Sonnet 5 em promo até 2026-08-31
  #    e Haiku 4.5. Claude 3.x foi aposentado da API; linha Opus custa $5/$25.)
  - model_name: claude-sonnet-5
    litellm_params: { model: anthropic/claude-sonnet-5, api_key: os.environ/ANTHROPIC_API_KEY }
  - model_name: claude-haiku-4-5
    litellm_params: { model: anthropic/claude-haiku-4-5, api_key: os.environ/ANTHROPIC_API_KEY }

  # ── Google Gemini ── (curadoria por custo: só os flash-lite econômicos.
  # ATENÇÃO: versões fixas do Gemini são aposentadas "para contas novas" a cada
  # geração (foi o que matou os 2.5 em 2026-07). Se um dia der 404 "no longer
  # available", trocar aqui pela geração seguinte ou voltar aos aliases -latest.)
  - model_name: gemini-3.5-flash-lite
    litellm_params: { model: gemini/gemini-3.5-flash-lite, api_key: os.environ/GEMINI_API_KEY }
  - model_name: gemini-3.1-flash-lite
    litellm_params: { model: gemini/gemini-3.1-flash-lite, api_key: os.environ/GEMINI_API_KEY }

  # ── DeepSeek — DESATIVADO temporariamente: conta sem créditos ('Insufficient
  #    Balance', 2026-07-27). Reative descomentando quando houver saldo. ──
  # - model_name: deepseek-chat
  #   litellm_params: { model: deepseek/deepseek-chat, api_key: os.environ/DEEPSEEK_API_KEY }
  # - model_name: deepseek-reasoner
  #   litellm_params: { model: deepseek/deepseek-reasoner, api_key: os.environ/DEEPSEEK_API_KEY }

  # ── Perplexity (busca web) ──
  - model_name: sonar-pro
    litellm_params: { model: perplexity/sonar-pro, api_key: os.environ/PERPLEXITY_API_KEY }

  # ── xAI (Grok) ──
  - model_name: grok-4-latest
    litellm_params: { model: xai/grok-4-latest, api_key: os.environ/XAI_API_KEY }

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
